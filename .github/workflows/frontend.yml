name: Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'scripts/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check architecture
        run: pnpm check:architecture
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm exec jest --runInBand
      - name: Build and prerender SEO pages
        run: pnpm build
      - name: Verify public SEO artifacts
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/about/director/index.html
          test -f dist/mandatory-public-disclosure/index.html
          grep -q 'application/ld+json' dist/index.html
          grep -q 'RDR School' dist/about/director/index.html
