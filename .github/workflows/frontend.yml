name: Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'scripts/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format scoped ownership migrations and emit chunks (temporary)
        run: |
          pnpm exec prettier --write app/styles.css packages/shell/components/appLauncher/AppLauncherApp.module.css scripts/audit-allowlist.json packages/domain/auth/components/credentialField/CredentialField.module.css packages/domain/auth/components/loginLayout/styles/optionOneAuth.css
          node -e 'const fs=require("node:fs"); ["app/styles.css","packages/shell/components/appLauncher/AppLauncherApp.module.css","scripts/audit-allowlist.json","packages/domain/auth/components/credentialField/CredentialField.module.css","packages/domain/auth/components/loginLayout/styles/optionOneAuth.css"].forEach((path)=>{const value=fs.readFileSync(path,"utf8");Array.from({length:Math.ceil(value.length/10000)},(_,i)=>i*10000).forEach((start)=>console.log("GH_FORMAT|"+path+"|"+start+"|"+JSON.stringify(value.slice(start,start+10000))));});'
      - name: Audit all tracked frontend source (non-blocking report)
        run: pnpm audit:guidelines
      - name: Check architecture
        run: pnpm check:architecture
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm exec jest --runInBand
      - name: Build and prerender SEO pages
        run: pnpm build
      - name: Install isolated Chromium test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/groovehub-browser" --no-package-lock --no-save playwright@1.55.0
          "$RUNNER_TEMP/groovehub-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser regression smoke (mobile, accessibility, themes)
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/groovehub-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/login > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/groovehub-preview.log"
            exit 1
          fi
          GH_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/groovehub-browser/node_modules/playwright" node scripts/e2e/browser-regressions.cjs
      - name: Verify public SEO artifacts
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/about/director/index.html
          test -f dist/mandatory-public-disclosure/index.html
          grep -q 'application/ld+json' dist/index.html
          grep -q 'RDR School' dist/about/director/index.html
      - name: ESLint (entire frontend)
        run: pnpm lint
