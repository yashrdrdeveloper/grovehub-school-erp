name: Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'scripts/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Resolve Tailwind/shadcn dependencies (temporary lockfile regeneration)
        run: pnpm install --no-frozen-lockfile
      - name: Emit regenerated lockfile chunks for verified GitHub commit
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.stringify(fs.readFileSync('pnpm-lock.yaml', 'utf8'));
          const chunkSize = 6000;
          for (let offset = 0; offset < payload.length; offset += chunkSize) {
            console.log('GROOVEHUB_LOCK_CHUNK:' + String(offset / chunkSize).padStart(5, '0') + ':' + payload.slice(offset, offset + chunkSize));
          }
          console.log('GROOVEHUB_LOCK_END:' + Math.ceil(payload.length / chunkSize));
          NODE
      - name: Check architecture
        run: pnpm check:architecture
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm exec jest --runInBand
      - name: Build and prerender SEO pages
        run: pnpm build
      - name: Verify public SEO artifacts
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/about/director/index.html
          test -f dist/mandatory-public-disclosure/index.html
          grep -q 'application/ld+json' dist/index.html
          grep -q 'RDR School' dist/about/director/index.html
