name: Core HTTP capability audit

on:
  push:
    branches: [phase1-refactor, develop]
    paths:
      - 'backend/libs/core/http/**'
      - 'backend/libs/core/tests/unit-test/http/**'
      - 'backend/libs/core/headercontext/**'
      - 'backend/libs/core/annotation/**'
      - 'backend/projects/**'
      - '.github/workflows/http-capability-audit.yml'
  pull_request:
    paths:
      - 'backend/libs/core/http/**'
      - 'backend/libs/core/tests/unit-test/http/**'
      - 'backend/libs/core/headercontext/**'
      - 'backend/projects/**'
      - '.github/workflows/http-capability-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-http:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - name: Enforce internal categories and exact mirrored tests
        shell: bash
        run: |
          root=backend/libs/core/http
          test -f "$root/http.go"
          while IFS= read -r file; do
            case "$file" in
              "$root/http.go") ;;
              *) echo "Unexpected public source: $file"; exit 1 ;;
            esac
          done < <(git ls-files "$root/" | grep -v '/internal/' | grep '[.]go$')
          for folder in "$root"/internal/src/*; do
            case "$(basename "$folder")" in
              config|constants|contracts|helpers|operations) test -d "$folder" ;;
              *) echo "Unexpected HTTP source category: $folder"; exit 1 ;;
            esac
          done
          count=0
          while IFS= read -r source; do
            [[ "$source" == *.go && "$source" != *_test.go ]] || continue
            relative="${source#"$root/internal/src/"}"
            test -f "$root/internal/resources/tests/unit-test/${relative%.go}_test.go" || { echo "Missing mirror: $source"; exit 1; }
            count=$((count + 1))
          done < <(git ls-files "$root/internal/src/")
          test "$count" -gt 0
          test -z "$(git ls-files "$root/" | grep '_test[.]go$' | grep -v '/internal/resources/tests/unit-test/' || true)"
      - name: Reject deprecated HTTP imports
        shell: bash
        run: |
          if git grep -nE 'libs/backend/core/http/(contracts|correlation|endpoint|headers|logging|readiness|request|response|tracing)(/|")|CoreImportPath[[:space:]]*\\+[[:space:]]*"/http/(contracts|correlation|endpoint|headers|logging|readiness|request|response|tracing)"' -- '*.go' '*.sh' '*.tmpl' '*.tpl'; then
            echo "Use the root core/http facade."
            exit 1
          fi
          if git grep -nE 'libs/backend/core/helpers(/|")' -- '*.go' '*.sh' '*.tmpl' '*.tpl'; then
            echo "Use core/utils."
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/libs/core/go.sum
      - name: Run HTTP tests and report statement coverage
        working-directory: backend/libs/core
        run: |
          go test -count=1 -covermode=atomic -coverpkg=./http/internal/src/...,./http -coverprofile="$RUNNER_TEMP/http-coverage.out" ./http/internal/resources/tests/unit-test/... ./tests/unit-test/http/...
          go tool cover -func="$RUNNER_TEMP/http-coverage.out" | tee "$RUNNER_TEMP/http-coverage.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: http-coverage
          path: ${{ runner.temp }}/http-coverage.out
