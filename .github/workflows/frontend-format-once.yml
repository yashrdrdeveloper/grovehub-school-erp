name: One-time semantic tag migration

on:
  push:
    branches:
      - phase-2.1-identity-account
    paths:
      - 'frontend/scripts/format-migration.trigger'

permissions:
  contents: write

jobs:
  format-migrated-css:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Migrate Box Text and Typography JSX tags to enum constants
        run: node scripts/migrate-semantic-tags.mjs
      - name: Format migrated frontend source
        run: pnpm exec prettier --write "{app,packages,scripts}/**/*.{ts,tsx,js,jsx,mjs,css,scss,json,md}"
      - name: Verify no raw semantic JSX tag literals remain
        run: node scripts/migrate-semantic-tags.mjs --check
      - name: Measure formatting impact on architecture debt
        run: node scripts/audit-guidelines.mjs | grep 'GH_AUDIT_SUMMARY'
      - name: Check formatter coverage excluding seven listed legacy source units
        run: pnpm format:check
      - name: Check architecture and no new legacy findings
        run: pnpm check:architecture
      - name: Typecheck formatted source
        run: pnpm typecheck
      - name: Test formatted source
        run: pnpm exec jest --runInBand
      - name: Build formatted source
        run: pnpm build
      - name: Commit formatting-only changes
        run: |
          git add app packages scripts
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(frontend): use typed semantic tags in all Box Text Typography JSX"
          git push origin HEAD:refs/heads/phase-2.1-identity-account
