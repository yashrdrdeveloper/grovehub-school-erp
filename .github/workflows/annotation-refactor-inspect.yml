name: Annotation refactor inspection
on:
  push:
    branches: [phase1-refactor]
    paths: ['.github/workflows/annotation-refactor-inspect.yml', 'backend/libs/core/annotation/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Inspect command callers and formatting
        shell: bash
        run: |
          git grep -n 'annotation/generation' || true
          git grep -n 'annotation/internal/src/impl' || true
          gofmt -w backend/libs/core/annotation
          while IFS= read -r path; do
            printf 'FORMAT_START:%s\n' "$path"
            base64 -w 240 "$path"
            printf 'FORMAT_END\n'
          done < <(git diff --name-only -- backend/libs/core/annotation)
      - name: Compile and test annotation capability
        working-directory: backend/libs/core
        run: GOWORK=off go test ./annotation/... ./tests/unit-test/annotation/...
