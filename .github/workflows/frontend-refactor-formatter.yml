name: One-time frontend refactor formatter

on:
  push:
    branches:
      - phase-2.1-identity-account
    paths:
      - 'frontend/scripts/refactor-format.trigger'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format modified frontend owners and tools
        run: pnpm format
      - name: Commit formatting changes
        run: |
          git add app packages scripts
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(frontend): format immutable copy and renderer refactor"
          git push origin HEAD:refs/heads/phase-2.1-identity-account
