name: One-time frontend enum checker formatter

on:
  push:
    branches:
      - phase-2.1-identity-account
    paths:
      - 'frontend/scripts/format-enums.trigger'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format new enum audit implementation
        run: pnpm exec prettier --write scripts/check-component-enums.mjs scripts/lib/component-enum-policy.mjs scripts/__tests__/component-enum-policy.test.mjs packages/domain/publicSite/pages/landing/components/siteMedia/constants/siteMedia.photoMotifsVariant.ts
      - name: Commit formatting-only edits
        run: |
          git add scripts packages/domain/publicSite/pages/landing/components/siteMedia/constants/siteMedia.photoMotifsVariant.ts
          if git diff --cached --quiet; then
            echo 'Enum checker already formatted'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(frontend): format closed component enum checker"
          git push origin HEAD:refs/heads/phase-2.1-identity-account
