name: Launcher source formatting (one-time)

on:
  push:
    branches: [phase1-refactor]
    paths: ['.github/workflows/launcher-format-once.yml']

permissions:
  contents: write

jobs:
  format-launcher:
    if: github.ref == 'refs/heads/phase1-refactor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Format tracked Launcher Go files and preserve source tokens
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/launcherfmt.go" <<'GO'
          package main
          
          import (
           "bytes"
           "fmt"
           "go/ast"
           "go/format"
           "go/parser"
           "go/scanner"
           "go/token"
           "os"
           "sort"
           "strings"
          )
          
          func tokens(src []byte) []string {
           var s scanner.Scanner
           f:=token.NewFileSet().AddFile("source.go",-1,len(src))
           s.Init(f,src,nil,scanner.ScanComments)
           var out []string
           for { _,t,l:=s.Scan(); if t==token.EOF {break}; if t==token.SEMICOLON {continue}; out=append(out,t.String()+"\x00"+l) }
           return out
          }
          
          func formatFile(path string) error {
           src,err:=os.ReadFile(path);if err!=nil{return err}
           base,err:=format.Source(src);if err!=nil{return err}
           fs:=token.NewFileSet(); file,err:=parser.ParseFile(fs,path,base,parser.ParseComments);if err!=nil{return err}
           edits:=map[int]string{}
           pos:=func(p token.Pos)int{return fs.Position(p).Offset}
           ast.Inspect(file,func(n ast.Node)bool{
            b,ok:=n.(*ast.BlockStmt); if !ok || len(b.List)==0{return true}
            left,right:=pos(b.Lbrace),pos(b.Rbrace)
            if !bytes.Contains(base[left:right],[]byte("\n")) {edits[left+1]="\n";edits[right]="\n"}
            if len(b.List)>=3 {for i:=1;i<len(b.List);i++ {prev,next:=b.List[i-1],b.List[i]; switch prev.(type){case *ast.IfStmt,*ast.ForStmt,*ast.RangeStmt,*ast.SwitchStmt,*ast.TypeSwitchStmt,*ast.SelectStmt:
             a,z:=pos(prev.End()),pos(next.Pos()); gap:=base[a:z]; if strings.TrimSpace(string(gap))==""&&bytes.Count(gap,[]byte("\n"))==1{edits[a]="\n"}
            }}}
            return true
           })
           for i:=1;i<len(file.Decls);i++ {prev,next:=file.Decls[i-1],file.Decls[i]; start:=next.Pos();switch d:=next.(type){case *ast.FuncDecl:if d.Doc!=nil{start=d.Doc.Pos()};case *ast.GenDecl:if d.Doc!=nil{start=d.Doc.Pos()}}
            a,z:=pos(prev.End()),pos(start);gap:=base[a:z];if strings.TrimSpace(string(gap))==""&&bytes.Count(gap,[]byte("\n"))==1{edits[a]="\n"}
           }
           if len(file.Decls)>0 { start:=file.Decls[0].Pos();if d,ok:=file.Decls[0].(*ast.GenDecl);ok&&d.Doc!=nil{start=d.Doc.Pos()};a,z:=pos(file.Name.End()),pos(start);gap:=base[a:z];if strings.TrimSpace(string(gap))==""&&bytes.Count(gap,[]byte("\n"))==1{edits[a]="\n"} }
           keys:=make([]int,0,len(edits));for k:=range edits{keys=append(keys,k)};sort.Sort(sort.Reverse(sort.IntSlice(keys)))
           out:=append([]byte(nil),base...);for _,k:=range keys{out=append(append(append([]byte(nil),out[:k]...),edits[k]...),out[k:]...)}
           out,err=format.Source(out);if err!=nil{return err}
           if strings.Join(tokens(base),"\x01")!=strings.Join(tokens(out),"\x01"){return fmt.Errorf("source tokens changed: %s",path)}
           if !bytes.Equal(src,out){if err:=os.WriteFile(path,out,0644);err!=nil{return err};fmt.Println(path)}
           return nil
          }
          func main(){for _,path:=range os.Args[1:]{if err:=formatFile(path);err!=nil{fmt.Fprintln(os.Stderr,err);os.Exit(1)}}}
          
          GO
          go build -o "$RUNNER_TEMP/launcherfmt" "$RUNNER_TEMP/launcherfmt.go"
          files=()
          while IFS= read -r -d '' path; do
            [[ "$path" == *.go ]] && files+=("$path")
          done < <(git ls-files -z backend/projects/platform/launcher/)
          printf 'Formatting %s tracked Go files\n' "${#files[@]}"
          "$RUNNER_TEMP/launcherfmt" "${files[@]}"
          cat > "$RUNNER_TEMP/launcherpolish.go" <<'GO'
          package main
          
          import (
           "bytes"
           "fmt"
           "go/ast"
           "go/format"
           "go/parser"
           "go/scanner"
           "go/token"
           "os"
           "sort"
           "strconv"
           "strings"
          )
          
          func tokens(src []byte) []string {
           var s scanner.Scanner
           f:=token.NewFileSet().AddFile("source.go",-1,len(src))
           s.Init(f,src,nil,scanner.ScanComments)
           var out []string
           for { _,t,l:=s.Scan(); if t==token.EOF {break}; if t==token.SEMICOLON {continue}; out=append(out,t.String()+"\x00"+l) }
           return out
          }
          
          func imports(src []byte)([]string,[]byte,error){
           fs:=token.NewFileSet()
           f,err:=parser.ParseFile(fs,"source.go",src,parser.ParseComments)
           if err!=nil{return nil,nil,err}
           var names []string
           rest:=append([]byte(nil),src...)
           for i:=len(f.Decls)-1;i>=0;i--{
            d,ok:=f.Decls[i].(*ast.GenDecl)
            if !ok||d.Tok!=token.IMPORT{continue}
            for _,s:=range d.Specs{
             spec:=s.(*ast.ImportSpec)
             name:=""
             if spec.Name!=nil{name=spec.Name.Name}
             names=append(names,name+" "+spec.Path.Value)
            }
            a,z:=fs.Position(d.Pos()).Offset,fs.Position(d.End()).Offset
            rest=append(rest[:a],rest[z:]...)
           }
           sort.Strings(names)
           return names,rest,nil
          }
          
          func formatFile(path string)error{
           src,err:=os.ReadFile(path);if err!=nil{return err}
           fs:=token.NewFileSet()
           f,err:=parser.ParseFile(fs,path,src,parser.ParseComments);if err!=nil{return err}
           pos:=func(p token.Pos)int{return fs.Position(p).Offset}
           type edit struct{start,end int;value string}
           var edits []edit
           add:=func(a,z int,v string){if a<=z{edits=append(edits,edit{a,z,v})}}
           // Separate standard library, external dependencies and project imports.
           var first,last *ast.GenDecl
           var groups [3][]string
           safe:=true
           count:=0
           for _,decl:=range f.Decls{
            d,ok:=decl.(*ast.GenDecl)
            if !ok||d.Tok!=token.IMPORT{break}
            if d.Doc!=nil{safe=false}
            if last!=nil&&strings.TrimSpace(string(src[pos(last.End()):pos(d.Pos())]))!=""{safe=false}
            if first==nil{first=d}
            last=d
            for _,s:=range d.Specs{
             spec:=s.(*ast.ImportSpec)
             if spec.Doc!=nil||spec.Comment!=nil{safe=false}
             p,e:=strconv.Unquote(spec.Path.Value);if e!=nil{return e}
             line:=spec.Path.Value
             if spec.Name!=nil{line=spec.Name.Name+" "+line}
             group:=1
             segment,_,_:=strings.Cut(p,"/")
             if strings.HasPrefix(p,"grovehub/")||strings.HasPrefix(p,"github.com/yashrdrdeveloper/grovehub-school-erp/"){group=2
             }else if !strings.Contains(segment,"."){group=0}
             groups[group]=append(groups[group],line);count++
            }
           }
           if first!=nil&&last!=nil&&safe&&count>1{
            a,z:=pos(first.Pos()),pos(last.End())
            for _,c:=range f.Comments{if pos(c.Pos())>=a&&pos(c.End())<=z{safe=false;break}}
            if safe{
             var blocks []string
             for _,g:=range groups{if len(g)>0{sort.Strings(g);blocks=append(blocks,strings.Join(g,"\n"))}}
             add(a,z,"import (\n"+strings.Join(blocks,"\n\n")+"\n)")
            }
           }
           // Remove empty edge gaps in blocks while keeping comments attached.
           ast.Inspect(f,func(n ast.Node)bool{
            switch b:=n.(type){
            case *ast.BlockStmt:
             if len(b.List)==0{return true}
             a,z:=pos(b.Lbrace)+1,pos(b.List[0].Pos())
             if strings.TrimSpace(string(src[a:z]))==""&&bytes.Count(src[a:z],[]byte("\n"))>1{add(a,z,"\n")}
             a,z=pos(b.List[len(b.List)-1].End()),pos(b.Rbrace)
             if strings.TrimSpace(string(src[a:z]))==""&&bytes.Count(src[a:z],[]byte("\n"))>1{add(a,z,"\n")}
            case *ast.IfStmt:
             // Wrap lengthy boolean conditions only at existing logical operators.
             if b.Cond==nil||fs.Position(b.Cond.Pos()).Line!=fs.Position(b.Cond.End()).Line{return true}
             if fs.Position(b.Cond.End()).Column<=120{return true}
             var wrap func(ast.Expr)
             wrap=func(e ast.Expr){
              x,ok:=e.(*ast.BinaryExpr);if !ok||(x.Op!=token.LAND&&x.Op!=token.LOR){return}
              wrap(x.X)
              a:=pos(x.OpPos)+len(x.Op.String())
              z:=pos(x.Y.Pos())
              if strings.TrimSpace(string(src[a:z]))==""{add(a,z,"\n")}
              wrap(x.Y)
             }
             wrap(b.Cond)
            }
            return true
           })
           sort.Slice(edits,func(i,j int)bool{return edits[i].start>edits[j].start})
           out:=append([]byte(nil),src...)
           prev:=len(src)+1
           for _,e:=range edits{if e.end>prev{return fmt.Errorf("overlapping edit in %s",path)};out=append(append(append([]byte(nil),out[:e.start]...),e.value...),out[e.end:]...);prev=e.start}
           out,err=format.Source(out);if err!=nil{return err}
           before,br,err:=imports(src);if err!=nil{return err}
           after,ar,err:=imports(out);if err!=nil{return err}
           if strings.Join(before,"\x01")!=strings.Join(after,"\x01")||strings.Join(tokens(br),"\x01")!=strings.Join(tokens(ar),"\x01"){return fmt.Errorf("source tokens changed: %s",path)}
           if !bytes.Equal(src,out){if err:=os.WriteFile(path,out,0644);err!=nil{return err};fmt.Println(path)}
           return nil
          }
          func main(){for _,path:=range os.Args[1:]{if err:=formatFile(path);err!=nil{fmt.Fprintln(os.Stderr,err);os.Exit(1)}}}
          
          GO
          go build -o "$RUNNER_TEMP/launcherpolish" "$RUNNER_TEMP/launcherpolish.go"
          "$RUNNER_TEMP/launcherpolish" "${files[@]}"
          test -z "$(gofmt -l "${files[@]}")"
          git diff --check
          git diff --stat
          git add -- "${files[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(launcher): organize imports and wrap long conditions'
          git push origin HEAD:refs/heads/phase1-refactor
