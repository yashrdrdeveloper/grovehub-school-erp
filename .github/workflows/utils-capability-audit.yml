name: Core utils capability audit

on:
  push:
    branches: [phase1-refactor, develop]
    paths:
      - 'backend/libs/core/utils/**'
      - 'backend/libs/core/tests/unit-test/utils/**'
      - 'backend/libs/core/helpers/**'
      - 'backend/libs/core/normalize/**'
      - 'backend/libs/core/tests/unit-test/normalize/**'
      - 'backend/libs/core/**'
      - 'backend/projects/**'
      - '.github/workflows/utils-capability-audit.yml'
  pull_request:
    paths:
      - 'backend/libs/core/utils/**'
      - 'backend/libs/core/tests/unit-test/utils/**'
      - 'backend/libs/core/helpers/**'
      - 'backend/libs/core/normalize/**'
      - 'backend/libs/core/tests/unit-test/normalize/**'
      - 'backend/libs/core/**'
      - 'backend/projects/**'
      - '.github/workflows/utils-capability-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-utils:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - name: Enforce single facade and exact mirrored tests
        shell: bash
        run: |
          root=backend/libs/core/utils
          test "$(git ls-files "$root/*.go" | grep -v '/internal/')" = "$root/utils.go"
          for folder in "$root"/internal/src/*; do
            case "$(basename "$folder")" in
              config|constants|contracts|helpers|operations) test -d "$folder" ;;
              *) echo "Unexpected utils source category: $folder"; exit 1 ;;
            esac
          done
          test ! -d backend/libs/core/helpers
          test ! -d backend/libs/core/normalize
          if git grep -nE 'libs/backend/core/(helpers|normalize)(/|")' -- '*.go' '*.tmpl' '*.tpl' '*.sh'; then
            echo "Use core/utils instead of removed core/helpers and core/normalize packages."
            exit 1
          fi
          count=0
          while IFS= read -r source; do
            [[ "$source" == *.go && "$source" != *_test.go ]] || continue
            relative="${source#"$root/internal/src/"}"
            test -f "$root/internal/resources/tests/unit-test/${relative%.go}_test.go" || { echo "Missing mirror: $source"; exit 1; }
            count=$((count + 1))
          done < <(git ls-files "$root/internal/src/")
          test "$count" -gt 0
          test -z "$(git ls-files "$root/" | grep '_test[.]go$' | grep -v '/internal/resources/tests/unit-test/' || true)"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/libs/core/go.sum
      - name: Run utils tests and enforce full statement coverage
        working-directory: backend/libs/core
        run: |
          go test -count=1 -covermode=atomic -coverpkg=./utils/... -coverprofile="$RUNNER_TEMP/utils-coverage.out" ./utils/internal/resources/tests/unit-test/... ./tests/unit-test/utils/...
          go tool cover -func="$RUNNER_TEMP/utils-coverage.out" | tee "$RUNNER_TEMP/utils-coverage.txt"
          awk '/^total:/ { found=1; if ($NF != "100.0%") exit 1 } END { if (!found) exit 1 }' "$RUNNER_TEMP/utils-coverage.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: utils-coverage
          path: ${{ runner.temp }}/utils-coverage.out
