name: Database capability audit
on:
  push:
    branches: [phase1-refactor]
    paths: ['.github/workflows/database-refactor-audit.yml', 'backend/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the database facade and test ownership
        shell: bash
        run: |
          if git grep -nE 'database/(postgres|transaction)"' -- '*.go'; then
            echo "Import the database facade instead of legacy packages."
            exit 1
          fi
          test ! -d backend/libs/core/database/postgres
          test ! -d backend/libs/core/database/transaction
          test -z "$(git ls-files 'backend/libs/core/database/**' | grep '_test[.]go$' | grep -v '/internal/resources/tests/unit-test/' || true)"
      - name: Enforce operation ownership and mirrored unit tests
        shell: bash
        run: |
          root=backend/libs/core/database/internal
          test -f "$root/src/transaction/transaction.go"
          test -f "$root/src/postgres/postgres.go"
          test -f "$root/src/transaction/operations/unitofwork/unitofwork.go"
          test -f "$root/src/transaction/operations/unitofwork/impl/unitofwork.go"
          test ! -d "$root/src/transaction/impl"
          test ! -d "$root/src/postgres/impl"
          count=0
          missing=0
          while IFS= read -r source; do
            [[ "$source" == *.go && "$source" != *_test.go ]] || continue
            relative="${source#"$root/src/"}"
            mirror="$root/resources/tests/unit-test/${relative%.go}_test.go"
            count=$((count + 1))
            if [[ ! -f "$mirror" ]]; then
              echo "Missing mirrored test: $mirror"
              missing=$((missing + 1))
            fi
          done < <(git ls-files "$root/src/")
          echo "Database source files: $count; missing mirrors: $missing"
          test "$count" -gt 0
          test "$missing" -eq 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/libs/core/go.sum
      - name: Verify database unit tests
        working-directory: backend/libs/core
        run: GOWORK=off go test ./database/... ./tests/unit-test/database/...
