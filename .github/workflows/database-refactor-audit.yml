name: Database capability audit
on:
  push:
    branches: [phase1-refactor]
    paths: ['.github/workflows/database-refactor-audit.yml', 'backend/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the database facade and test ownership
        shell: bash
        run: |
          if git grep -nE 'database/(postgres|transaction)"' -- '*.go'; then
            echo "Import the database facade instead of legacy packages."
            exit 1
          fi
          test ! -d backend/libs/core/database/postgres
          test ! -d backend/libs/core/database/transaction
          test -z "$(git ls-files 'backend/libs/core/database/**' | grep '_test[.]go$' | grep -v '/internal/resources/tests/unit-test/' || true)"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/libs/core/go.sum
      - name: Verify database unit tests
        working-directory: backend/libs/core
        run: GOWORK=off go test ./database/... ./tests/unit-test/database/...
