name: Core idempotency capability audit

on:
  push:
    branches: [phase1-refactor, develop]
    paths:
      - 'backend/libs/core/idempotency/**'
      - 'backend/libs/core/tests/unit-test/idempotency/**'
      - '.github/workflows/idempotency-capability-audit.yml'
  pull_request:
    paths:
      - 'backend/libs/core/idempotency/**'
      - 'backend/libs/core/tests/unit-test/idempotency/**'
      - '.github/workflows/idempotency-capability-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-idempotency:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - name: Enforce single facade and mirrored tests
        shell: bash
        run: |
          root=backend/libs/core/idempotency
          test "$(git ls-files "$root/" | grep '[.]go$' | grep -v '/internal/')" = "$root/idempotency.go"
          for folder in "$root"/internal/src/*; do
            case "$(basename "$folder")" in
              operations|helpers|constants|contracts|config) test -d "$folder" ;;
              *) echo "Unexpected idempotency source category: $folder"; exit 1 ;;
            esac
          done
          count=0
          while IFS= read -r source; do
            [[ "$source" == *.go && "$source" != *_test.go ]] || continue
            relative="${source#"$root/internal/src/"}"
            test -f "$root/internal/resources/tests/unit-test/${relative%.go}_test.go" || { echo "Missing mirror: $source"; exit 1; }
            count=$((count + 1))
          done < <(git ls-files "$root/internal/src/")
          test "$count" -gt 0
          if git grep -nE 'libs/backend/core/idempotency/(contracts|helpers|validators)(/|")' -- '*.go' '*.sh' '*.tmpl' '*.tpl'; then
            echo "Use the root core/idempotency facade."
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/libs/core/go.sum
      - name: Run idempotency tests and enforce full statement coverage
        working-directory: backend/libs/core
        run: |
          go test -count=1 -covermode=atomic -coverpkg=./idempotency/... -coverprofile="$RUNNER_TEMP/idempotency-coverage.out" ./idempotency/internal/resources/tests/unit-test/... ./tests/unit-test/idempotency/...
          go tool cover -func="$RUNNER_TEMP/idempotency-coverage.out" | tee "$RUNNER_TEMP/idempotency-coverage.txt"
          awk '/^total:/ { found=1; if ($NF != "100.0%") exit 1 } END { if (!found) exit 1 }' "$RUNNER_TEMP/idempotency-coverage.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: idempotency-coverage
          path: ${{ runner.temp }}/idempotency-coverage.out
