name: Shared library release candidates
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/libs/core/**'
      - 'frontend/libs/**'
      - 'frontend/projects/**'
      - 'backend/projects/**'
      - 'scripts/release/pack-platform-contracts.sh'
      - 'scripts/release/pack-frontend-libraries.mjs'
      - 'scripts/release/prepare-frontend-consumer.mjs'
      - '.github/workflows/shared-library-candidates.yml'
permissions:
  contents: read
jobs:
  go-core:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      CORE_MODULE: grovehub/libs/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/libs/core/go.sum
      - name: Package an immutable Core source candidate
        run: |
          mkdir -p "$RUNNER_TEMP/core-candidate" "$RUNNER_TEMP/core-source"
          git archive --format=tar.gz HEAD backend/libs/core > "$RUNNER_TEMP/core-candidate/core-source.tar.gz"
          (cd "$RUNNER_TEMP/core-candidate" && sha256sum core-source.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/core-candidate/core-source.tar.gz" -C "$RUNNER_TEMP/core-source"
          test "$(cd "$RUNNER_TEMP/core-source/backend/libs/core" && go list -m)" = "$CORE_MODULE"
      - name: Validate isolated Core consumer against the source candidate
        run: |
          mkdir "$RUNNER_TEMP/core-consumer"
          cd "$RUNNER_TEMP/core-consumer"
          go mod init example.test/core-consumer
          go mod edit -require="$CORE_MODULE@v0.0.0" -replace="$CORE_MODULE=$RUNNER_TEMP/core-source/backend/libs/core"
          printf 'package consumer\nimport (\n _ "%s/gateway"\n _ "%s/database"\n)\n' "$CORE_MODULE" "$CORE_MODULE" > consumer.go
          go test -mod=mod ./...
          go list -m -json "$CORE_MODULE" > "$RUNNER_TEMP/core-candidate/consumer-module.json"
          go mod verify
      - name: Export provider-owned contract bundle
        run: bash scripts/release/pack-platform-contracts.sh "$RUNNER_TEMP/platform-contracts" "$GITHUB_SHA"
      - name: Build actual Go consumer projects using the packaged Core source
        run: |
          mkdir -p "$RUNNER_TEMP/contracts" "$RUNNER_TEMP/go-consumers" "$RUNNER_TEMP/core-candidate/locks"
          (cd "$RUNNER_TEMP/platform-contracts" && sha256sum -c platform-contracts.tar.gz.sha256)
          tar -xzf "$RUNNER_TEMP/platform-contracts/platform-contracts.tar.gz" -C "$RUNNER_TEMP/contracts"
          (cd "$RUNNER_TEMP/contracts" && sha256sum -c SHA256SUMS)
          export GROOVEHUB_CONTRACT_ROOT="$RUNNER_TEMP/contracts/services"
          export GROOVEHUB_SCHOOL_CONTRACT="$RUNNER_TEMP/contracts/school/registry.yaml"
          export GROOVEHUB_CLIENT_GENERATOR="$RUNNER_TEMP/contracts/tools/generate.sh"
          for project in school internal-tool; do
            mkdir "$RUNNER_TEMP/go-consumers/$project"
            git archive HEAD "backend/projects/$project" | tar -x -C "$RUNNER_TEMP/go-consumers/$project" --strip-components=3
            (
              cd "$RUNNER_TEMP/go-consumers/$project"
              go mod edit -replace="$CORE_MODULE=$RUNNER_TEMP/core-source/backend/libs/core"
              make generate-clients
              go mod tidy
              go list -m -json "$CORE_MODULE" > "$RUNNER_TEMP/core-candidate/locks/$project.module.json"
              go mod verify
              cp go.mod "$RUNNER_TEMP/core-candidate/locks/$project.go.mod"
              cp go.sum "$RUNNER_TEMP/core-candidate/locks/$project.go.sum"
              go test -mod=readonly ./...
              go build -mod=readonly ./...
              cmp go.mod "$RUNNER_TEMP/core-candidate/locks/$project.go.mod"
              cmp go.sum "$RUNNER_TEMP/core-candidate/locks/$project.go.sum"
            )
          done
      - uses: actions/upload-artifact@v4
        with:
          name: platform-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/platform-contracts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: go-core-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/core-candidate/
          if-no-files-found: error
  frontend-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pack versioned shared frontend packages
        run: node scripts/release/pack-frontend-libraries.mjs "$RUNNER_TEMP/frontend-packages" "$GITHUB_SHA"
      - name: Build both frontend applications from packed dependencies
        run: |
          mkdir "$RUNNER_TEMP/frontend-packages/locks"
          for project in school internal-tool; do
            consumer="$RUNNER_TEMP/frontend-$project"
            mkdir "$consumer"
            git archive HEAD "frontend/projects/$project" | tar -x -C "$consumer" --strip-components=3
            node scripts/release/prepare-frontend-consumer.mjs "$consumer" "$RUNNER_TEMP/frontend-packages"
            (
              cd "$consumer"
              pnpm install --lockfile-only --no-frozen-lockfile
              cp pnpm-lock.yaml "$RUNNER_TEMP/frontend-packages/locks/$project.pnpm-lock.yaml"
              cp package.json "$RUNNER_TEMP/frontend-packages/locks/$project.package.json"
              pnpm install --frozen-lockfile
              if [[ "$project" == internal-tool ]]; then pnpm test; fi
              pnpm build
              cmp pnpm-lock.yaml "$RUNNER_TEMP/frontend-packages/locks/$project.pnpm-lock.yaml"
            )
          done
      - name: Checksum release candidates
        working-directory: ${{ runner.temp }}/frontend-packages
        run: sha256sum *.tgz manifest.json locks/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-library-candidates-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-packages/
          if-no-files-found: error
