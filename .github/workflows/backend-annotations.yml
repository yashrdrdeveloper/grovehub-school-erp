name: Backend annotation build

on:
  push:
    branches:
      - phase-2.1-identity-account
    paths:
      - "backend/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/backend-annotations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annotation-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: backend/go.sum
      - name: Lint Foundation repository formatting and function signatures
        run: make backend-lint
      - name: Compile the complete backend with generated annotations
        run: make backend-build
      - name: Verify annotation packages resolve after folder refactor
        working-directory: backend
        run: go list -overlay=.generated/overlay.json ./libs/core/annotation/...
      - name: Test annotation source generators
        working-directory: backend
        run: go test ./libs/core/annotation/generation/patchdto ./libs/core/annotation/generation/search ./libs/core/annotation/generation/routes ./libs/core/annotation/generation/clients ./libs/core/annotation/generation/mappers
      - name: Run available core, launcher and service unit suites
        working-directory: backend
        run: |
          suites=(./libs/core/tests/unit-test/... ./launcher/tests/unit-test/... ./services/identity/tests/unit-test/... ./services/integration/tests/unit-test/...)
          # Some services intentionally have no unit-test directory.
          if [[ -d services/foundation/tests/unit-test ]]; then
            suites+=(./services/foundation/tests/unit-test/...)
          fi
          go test -vet=off -overlay=.generated/overlay.json "${suites[@]}"
      - name: Validate generated source on a clean checkout
        shell: bash
        run: |
          test -s backend/.generated/overlay.json
          test -s backend/services/foundation/.generated/internal/app/routes/zz_routes.gen.go
          test -s backend/services/foundation/.generated/internal/app/entity/zz_tables.gen.go
          test -s backend/services/foundation/.generated/internal/app/client/person/impl/zz_clients.gen.go
          test -s backend/services/identity/.generated/routes/zz_routes.gen.go
          test -s backend/services/integration/.generated/routes/zz_routes.gen.go
          test -s backend/services/identity/.generated/mappers/impl/zz_mappers.gen.go
          test -s backend/services/foundation/.generated/internal/app/mappers/person/impl/zz_mappers.gen.go
          test -s backend/services/foundation/.generated/internal/app/repository/person/impl/zz_search.gen.go
          test -s backend/services/foundation/.generated/internal/app/dto/person/zz_patchdto.gen.go
          test -s backend/services/identity/.generated/entity/zz_tables.gen.go
          test -s backend/services/integration/.generated/entity/zz_tables.gen.go
          test -s backend/services/foundation/.generated/internal/app/events/producers/person/operations/changed/zz_events.gen.go
          test -s backend/services/identity/.generated/events/accounts/zz_events.gen.go
          test -s backend/services/integration/.generated/events/connections/mailbox/zz_events.gen.go
