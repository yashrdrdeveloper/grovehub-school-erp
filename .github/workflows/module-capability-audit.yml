name: Core module capability audit

on:
  push:
    branches: [phase1-refactor, develop]
    paths:
      - 'backend/libs/core/module/**'
      - 'backend/libs/core/tests/unit-test/module/**'
      - '.github/workflows/module-capability-audit.yml'
  pull_request:
    paths:
      - 'backend/libs/core/module/**'
      - 'backend/libs/core/tests/unit-test/module/**'
      - '.github/workflows/module-capability-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-module:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - name: Enforce single facade and mirrored contracts
        shell: bash
        run: |
          root=backend/libs/core/module
          test "$(git ls-files "$root/" | grep '[.]go$' | grep -v '/internal/')" = "$root/module.go"
          for folder in "$root"/internal/src/*; do
            case "$(basename "$folder")" in
              operations|helpers|constants|contracts|config) test -d "$folder" ;;
              *) echo "Unexpected module source category: $folder"; exit 1 ;;
            esac
          done
          count=0
          while IFS= read -r source; do
            [[ "$source" == *.go && "$source" != *_test.go ]] || continue
            relative="${source#"$root/internal/src/"}"
            test -f "$root/internal/resources/tests/unit-test/${relative%.go}_test.go" || { echo "Missing mirror: $source"; exit 1; }
            count=$((count + 1))
          done < <(git ls-files "$root/internal/src/")
          test "$count" -gt 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/libs/core/go.sum
      - name: Verify lifecycle contracts and facade
        working-directory: backend/libs/core
        run: go test -count=1 ./module/... ./tests/unit-test/module/...
