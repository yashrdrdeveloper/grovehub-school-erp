name: Frontend copy and let inventory

on:
  push:
    branches: [phase-2.1-identity-account]
    paths: [frontend/scripts/copy-let-audit.trigger]

jobs:
  inventory:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/audit-copy-let.mjs
