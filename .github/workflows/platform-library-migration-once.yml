name: Extract Platform shared library (one-time)

on:
  push:
    branches: [phase1-refactor]
    paths: ['.github/workflows/platform-library-migration-once.yml']

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/phase1-refactor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Extract module, update all imports and enforce standalone coverage
        shell: bash
        run: |
          set -euo pipefail
          export GOWORK=off
          python3 .github/scripts/platform-library-migration-once.py
          (cd backend/projects/platform && go mod edit -require=grovehub/libs/platform@v0.0.0 -replace=grovehub/libs/platform=../../libs/platform)
          (cd backend/libs/platform && go mod tidy && gofmt -w session && go build ./... && go vet ./...)
          gofmt -w backend/projects/platform/launcher
          bash backend/libs/platform/tools/coverage/check.sh "$RUNNER_TEMP/platform-library-coverage.out"
          if git grep -nF '"grovehub/internal/session' -- '*.go'; then exit 1; fi
          # Workflow updates require the separately authorized repository connector.
          git restore -- .github/workflows/backend-annotations.yml
          git diff --check
          git add -A
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(platform): extract standalone shared session module'
          git push origin HEAD:refs/heads/phase1-refactor
