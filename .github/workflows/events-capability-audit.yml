name: Core events capability audit

on:
  push:
    branches: [phase1-refactor, develop]
    paths:
      - 'backend/libs/core/events/**'
      - 'backend/libs/core/tests/unit-test/events/**'
      - 'backend/projects/**'
      - '.github/workflows/events-capability-audit.yml'
  pull_request:
    paths:
      - 'backend/libs/core/events/**'
      - 'backend/libs/core/tests/unit-test/events/**'
      - 'backend/projects/**'
      - '.github/workflows/events-capability-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-events:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - name: Enforce single public events facade and mirrored tests
        shell: bash
        run: |
          root=backend/libs/core/events
          test ! -d "$root/pipeline"
          if git grep -nE 'libs/backend/core/events/pipeline(/|")' -- '*.go' '*.tmpl' '*.tpl' '*.sh'; then
            echo "Import core/events instead of core/events/pipeline."
            exit 1
          fi
          count=0
          while IFS= read -r source; do
            [[ "$source" == *.go && "$source" != *_test.go ]] || continue
            relative="${source#"$root/internal/src/"}"
            test -f "$root/internal/resources/tests/unit-test/${relative%.go}_test.go" || { echo "Missing mirror: $source"; exit 1; }
            count=$((count + 1))
          done < <(git ls-files "$root/internal/src/")
          test "$count" -gt 0
          test -z "$(git ls-files "$root/" | grep '_test[.]go$' | grep -v '/internal/resources/tests/unit-test/' || true)"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/libs/core/go.sum
      - name: Run event tests and verify coverage
        working-directory: backend/libs/core
        run: |
          go test -count=1 -covermode=atomic -coverpkg=./events/... -coverprofile="$RUNNER_TEMP/events-coverage.out" ./events/internal/resources/tests/unit-test/... ./tests/unit-test/events/...
          go tool cover -func="$RUNNER_TEMP/events-coverage.out" | tee "$RUNNER_TEMP/events-coverage.txt"
          awk '/^total:/ { found=1; if ($NF != "100.0%") exit 1 } END { if (!found) exit 1 }' "$RUNNER_TEMP/events-coverage.txt"
