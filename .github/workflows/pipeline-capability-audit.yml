name: Core pipeline capability audit
on:
  push:
    branches: [phase1-refactor, develop]
    paths:
      - 'backend/libs/core/pipeline/**'
      - 'backend/libs/core/tests/unit-test/pipeline/**'
      - 'backend/projects/**'
      - '.github/workflows/pipeline-capability-audit.yml'
  pull_request:
    paths:
      - 'backend/libs/core/pipeline/**'
      - 'backend/libs/core/tests/unit-test/pipeline/**'
      - 'backend/projects/**'
      - '.github/workflows/pipeline-capability-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-pipeline:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy public pipeline imports
        shell: bash
        run: |
          if git grep -nE 'libs/core/pipeline/(rest|service)(/|")|CoreImportPath.*"/pipeline/(rest|service)"' -- '*.go' '*.tmpl' '*.tpl' '*.sh'; then
            echo "Use core/pipeline instead of the removed public subpackages."
            exit 1
          fi
      - name: Verify source mirrors
        shell: bash
        run: |
          root=backend/libs/core/pipeline
          test "$(git ls-files "$root/" | grep -v '/internal/' | grep '[.]go$')" = "$root/pipeline.go"
          test ! -d "$root/rest"
          test ! -d "$root/service"
          for folder in "$root"/internal/src/*; do
            case "$(basename "$folder")" in
              operations|helpers|constants|contracts|config) test -d "$folder" ;;
              *) exit 1 ;;
            esac
          done
          while IFS= read -r source; do
            [[ "$source" == *.go && "$source" != *_test.go ]] || continue
            relative="${source#"$root/internal/src/"}"
            test -f "$root/internal/resources/tests/unit-test/${relative%.go}_test.go" || { echo "Missing mirror: $source"; exit 1; }
          done < <(git ls-files "$root/internal/src/")
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/libs/core/go.sum
      - name: Run pipeline tests and report coverage
        working-directory: backend/libs/core
        run: |
          go test -count=1 -covermode=atomic -coverpkg=./pipeline/internal/src/...,./pipeline -coverprofile="$RUNNER_TEMP/pipeline-coverage.out" ./pipeline/... ./tests/unit-test/pipeline/...
          go tool cover -func="$RUNNER_TEMP/pipeline-coverage.out" | tee "$RUNNER_TEMP/pipeline-coverage.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-coverage
          path: ${{ runner.temp }}/pipeline-coverage.out
