services:
  haraka:
    build:
      context: ../../..
      dockerfile: deployments/docker/haraka/Dockerfile
    container_name: grovehub-haraka
    restart: unless-stopped
    environment:
      HARAKA_HOSTNAME: ${MAIL_PROVIDER_HARAKA_HOSTNAME:-mail.local.grovehub}
      MAIL_PROVIDER_RELAY_HOST: ${MAIL_PROVIDER_RELAY_HOST:-}
      MAIL_PROVIDER_RELAY_PORT: ${MAIL_PROVIDER_RELAY_PORT:-587}
      MAIL_PROVIDER_RELAY_USERNAME: ${MAIL_PROVIDER_RELAY_USERNAME:-}
      MAIL_PROVIDER_RELAY_PASSWORD: ${MAIL_PROVIDER_RELAY_PASSWORD:-}
      MAIL_PROVIDER_RELAY_TLS: ${MAIL_PROVIDER_RELAY_TLS:-true}
    ports:
      - "127.0.0.1:${MAIL_PROVIDER_SMTP_PORT:-2525}:2525"
    volumes:
      - grovehub_haraka_queue:/opt/haraka/queue
      - grovehub_haraka_dkim:/opt/haraka/config/dkim
    mem_limit: ${HARAKA_MEMORY_LIMIT:-512m}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2525"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  grovehub_haraka_queue:
  grovehub_haraka_dkim:
