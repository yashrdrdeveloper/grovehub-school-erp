openapi: 3.1.0
info:
  title: GroveHub Mail Provider API
  version: 0.1.0
  description: GroveHub outbound mail-provider domain, sender, message submission, retry, resend, and reply-thread contract.
paths:
  /mail-provider/domains:
    get:
      operationId: listMailProviderDomains
      summary: List all registered sending domains
      description: Returns the complete domain list. This endpoint is intentionally not paginated because the domain set is expected to remain limited.
      tags: [Mail Provider]
      responses:
        '200':
          description: Domains returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainListSuccessResponse'
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: registerMailProviderDomain
      summary: Register a sending domain and obtain its DNS TXT ownership challenge
      tags: [Mail Provider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDomainRequest'
      responses:
        '201':
          description: Domain registered in pending-verification state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/domains/by-name/{domainName}:
    parameters:
      - $ref: '#/components/parameters/DomainName'
    get:
      operationId: getMailProviderDomainByName
      summary: Get a registered sending domain by normalized domain name
      tags: [Mail Provider]
      responses:
        '200':
          description: Domain returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/domains/{domainId}:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    get:
      operationId: getMailProviderDomain
      summary: Get a registered sending domain
      tags: [Mail Provider]
      responses:
        '200':
          description: Domain returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/domains/{domainId}/verify:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    post:
      operationId: verifyMailProviderDomain
      summary: Verify the GroveHub DNS TXT ownership challenge
      tags: [Mail Provider]
      responses:
        '200':
          description: Domain verified or already verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyError' }
  /mail-provider/domains/{domainId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/DomainId'
    post:
      operationId: deactivateMailProviderDomain
      summary: Deactivate a sending domain
      tags: [Mail Provider]
      responses:
        '200':
          description: Domain deactivated or already deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/senders:
    get:
      operationId: listMailProviderSenders
      summary: List all registered senders
      description: Returns the complete sender list. This endpoint is intentionally not paginated because the sender set is expected to remain limited.
      tags: [Mail Provider]
      responses:
        '200':
          description: Senders returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderListSuccessResponse'
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: registerMailProviderSender
      summary: Register a sender address under a verified domain
      tags: [Mail Provider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSenderRequest'
      responses:
        '201':
          description: Sender registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/senders/{senderId}:
    parameters:
      - $ref: '#/components/parameters/SenderId'
    get:
      operationId: getMailProviderSender
      summary: Get a registered sender
      tags: [Mail Provider]
      responses:
        '200':
          description: Sender returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/senders/{senderId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/SenderId'
    post:
      operationId: deactivateMailProviderSender
      summary: Deactivate a sender
      tags: [Mail Provider]
      responses:
        '200':
          description: Sender deactivated or already deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/messages:
    post:
      operationId: sendMailProviderMessage
      summary: Persist and submit a new message to the GroveHub Haraka MTA
      description: A SUBMITTED response means Haraka accepted the message for its outbound path; it does not mean final mailbox delivery. Replaying the same request with the same Idempotency-Key returns the same message and never sends a second copy. Use the resend action for an intentional second copy.
      tags: [Mail Provider]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message submitted to Haraka or the matching idempotent message returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/messages/search:
    post:
      operationId: searchMailProviderMessages
      summary: Search mail-provider messages with cursor pagination, filters, and sorting
      description: |
        Search text matches message ID, gid, sender ID, thread/relation IDs, internet Message-ID, subject, status, and recipient addresses.
        Supported filter fields: messageId, gid, senderId, subject, status, createdAt, updatedAt.
        Supported sort fields: messageId, gid, senderId, subject, status, createdAt, updatedAt.
        Only one sort field is accepted. Default sort is createdAt DESC. rows defaults to 25 and is capped at 100.
      tags: [Mail Provider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageSearchRequest'
      responses:
        '200':
          description: Matching messages returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSearchSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    get:
      operationId: getMailProviderMessage
      summary: Get a message submission record
      tags: [Mail Provider]
      responses:
        '200':
          description: Message returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/messages/{messageId}/retry:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      operationId: retryMailProviderMessage
      summary: Retry submission of an existing failed message
      description: Only FAILED messages can be retried. The same message row and messageId are reused and no new copy is created.
      tags: [Mail Provider]
      responses:
        '200':
          description: Existing message retried and submitted to Haraka.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/messages/{messageId}/resend:
    parameters:
      - $ref: '#/components/parameters/MessageId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: resendMailProviderMessage
      summary: Send a new copy of an existing submitted message
      description: Only SUBMITTED messages can be resent. A resend creates a new messageId and a new independent email thread, while recording resendOfMessageId. The Idempotency-Key protects this resend action from duplicate HTTP retries.
      tags: [Mail Provider]
      responses:
        '201':
          description: New message copy created and submitted to Haraka.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mail-provider/messages/{messageId}/reply:
    parameters:
      - $ref: '#/components/parameters/MessageId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: replyMailProviderMessage
      summary: Send a reply in the same email thread
      description: Only SUBMITTED messages can be replied to. The new message inherits gid, sender, To/Cc recipients, uses the same threadId, and emits Message-ID, In-Reply-To, and References headers for mail-client threading. Bcc recipients are not carried into replies.
      tags: [Mail Provider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyMessageRequest'
      responses:
        '201':
          description: Reply created and submitted to Haraka.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyError' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  parameters:
    DomainId:
      name: domainId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DomainName:
      name: domainName
      in: path
      required: true
      schema: { type: string, example: school.example }
    SenderId:
      name: senderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: messageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key for one logical create/resend/reply action. Reuse the same key only when retrying the same HTTP action.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    RegisterDomainRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, example: school.example }
    RegisterSenderRequest:
      type: object
      additionalProperties: false
      required: [domainId, email, displayName]
      properties:
        domainId: { type: string, format: uuid }
        email: { type: string, format: email, example: fees@school.example }
        displayName: { type: string, example: School Fees }
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [gid, senderId, to, subject]
      properties:
        gid:
          type: string
          format: uuid
          description: Mandatory GroveHub global entity identifier associated with this message.
        senderId: { type: string, format: uuid }
        to:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: email }
        cc:
          type: array
          items: { type: string, format: email }
        bcc:
          type: array
          items: { type: string, format: email }
        subject: { type: string, minLength: 1 }
        textBody: { type: string }
        htmlBody: { type: string }
    ReplyMessageRequest:
      type: object
      additionalProperties: false
      properties:
        textBody: { type: string }
        htmlBody: { type: string }
      anyOf:
        - required: [textBody]
        - required: [htmlBody]
    MessageSearchRequest:
      type: object
      additionalProperties: false
      properties:
        searchText:
          type: string
          maxLength: 256
        filters:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/SearchFilter'
        sort:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/SearchSort'
        pageInfo:
          $ref: '#/components/schemas/SearchPageRequest'
    SearchFilter:
      type: object
      additionalProperties: false
      required: [field, operator]
      properties:
        field:
          type: string
          enum: [messageId, gid, senderId, subject, status, createdAt, updatedAt]
        operator:
          type: string
          enum: [EQUALS, NOT_EQUALS, IN, NIN, GT, GTE, LT, LTE, CONTAINS, STARTS_WITH]
        values:
          type: array
          maxItems: 50
          items: { type: string }
    SearchSort:
      type: object
      additionalProperties: false
      required: [field]
      properties:
        field:
          type: string
          enum: [messageId, gid, senderId, subject, status, createdAt, updatedAt]
        direction:
          type: string
          enum: [ASC, DESC]
    SearchPageRequest:
      type: object
      additionalProperties: false
      properties:
        rows:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        cursor:
          type: string
    SearchPageResponse:
      type: object
      required: [rows, hasNext]
      properties:
        rows: { type: integer }
        nextCursor: { type: string }
        hasNext: { type: boolean }
    Domain:
      type: object
      required: [domainId, name, verificationHost, verificationValue, status, version, createdAt, updatedAt]
      properties:
        domainId: { type: string, format: uuid }
        name: { type: string }
        verificationHost: { type: string }
        verificationValue: { type: string }
        status: { type: string, enum: [PENDING_VERIFICATION, VERIFIED, DEACTIVATED] }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Sender:
      type: object
      required: [senderId, domainId, email, displayName, status, version, createdAt, updatedAt]
      properties:
        senderId: { type: string, format: uuid }
        domainId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [ACTIVE, DEACTIVATED] }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Message:
      type: object
      required: [messageId, gid, senderId, threadId, internetMessageId, to, subject, status, version, createdAt, updatedAt]
      properties:
        messageId: { type: string, format: uuid }
        gid:
          type: string
          format: uuid
          description: GroveHub global entity identifier associated with the message.
        senderId: { type: string, format: uuid }
        threadId:
          type: string
          format: uuid
          description: GroveHub mail thread identifier. The first message uses its own messageId.
        parentMessageId:
          type: string
          format: uuid
          description: Immediate parent when this message is a reply.
        resendOfMessageId:
          type: string
          format: uuid
          description: Source message when this message is an intentional resend.
        internetMessageId:
          type: string
          description: RFC 5322 Message-ID value stored without angle brackets.
        inReplyTo:
          type: string
          description: Parent RFC 5322 Message-ID value stored without angle brackets.
        referenceMessageIds:
          type: array
          items: { type: string }
          description: Ordered RFC 5322 References chain stored without angle brackets.
        to:
          type: array
          items: { type: string, format: email }
        cc:
          type: array
          items: { type: string, format: email }
        bcc:
          type: array
          items: { type: string, format: email }
        subject: { type: string }
        status: { type: string, enum: [QUEUED, SUBMITTED, FAILED] }
        failureMessage: { type: string }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MessageSearchResult:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        pageInfo:
          $ref: '#/components/schemas/SearchPageResponse'
    DomainSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Domain' }
    DomainListSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
    SenderSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Sender' }
    SenderListSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sender'
    MessageSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Message' }
    MessageSearchSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          $ref: '#/components/schemas/MessageSearchResult'
    ErrorResponse:
      type: object
      required: [success, errorCode, errorMessage, httpErrorCode, errorMetaData]
      properties:
        success: { type: boolean, const: false }
        errorCode: { type: string }
        errorMessage: { type: string }
        httpErrorCode: { type: integer }
        errorMetaData: { type: object }
  responses:
    BadRequest:
      description: The supplied request is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: The requested mail-provider resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: The operation conflicts with the current mail-provider state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    DependencyError:
      description: DNS verification or SMTP submission dependency failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Mail Provider could not complete the operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
