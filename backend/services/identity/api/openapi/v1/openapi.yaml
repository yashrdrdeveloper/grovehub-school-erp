openapi: 3.1.0
info:
  title: GroveHub Identity API
  version: 0.2.0
  description: Identity Auth entry-point contract.
paths:
  /auth/register:
    post:
      operationId: registerIdentityAccount
      summary: Register a GroveHub identity account and password credential
      description: >-
        Auth resolves an existing Foundation Person by optional gid or exact normalized email, creating a new Person/GID only when needed.
        firstName, middleName, and lastName are always mandatory fields. After Person resolution, Auth always patches those three names through
        Foundation UpdatePerson before creating the Identity Account. middleName may be an explicit empty string. When gid is supplied,
        the email must already belong to that Person.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Identity account and password credential created.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterSuccessResponse"
        "400":
          $ref: "#/components/responses/InvalidRegistration"
        "409":
          $ref: "#/components/responses/RegistrationAlreadyExists"
        "500":
          $ref: "#/components/responses/RegistrationFailed"
components:
  headers:
    TraceID:
      description: GroveHub trace identifier for support and correlation. W3C traceparent remains the propagation contract.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - firstName
        - middleName
        - lastName
        - email
        - password
      properties:
        gid:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Optional existing Foundation Person GID. When supplied, the submitted email must belong to that Person.
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: Mandatory current first name; applied to the resolved Foundation Person before Account creation.
        middleName:
          type: string
          maxLength: 100
          description: Mandatory field; may be empty when the person has no middle name. Applied to the resolved Foundation Person before Account creation.
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: Mandatory current last name; applied to the resolved Foundation Person before Account creation.
        email:
          type: string
          format: email
          minLength: 1
          description: Required Identity email and canonical Person-resolution key when gid is omitted.
        phoneNumber:
          type: string
          description: Optional phone number. Identity normalizes it before Account creation.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Password is validated but never trimmed, lowercased, or otherwise normalized.
    RegisterResult:
      type: object
      additionalProperties: false
      required:
        - accountId
        - personGid
        - email
        - status
      properties:
        accountId:
          type: string
          format: uuid
        personGid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - DEACTIVATED
    RegisterSuccessResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/RegisterResult"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - errorCode
        - errorMessage
        - httpErrorCode
        - errorMetaData
      properties:
        success:
          type: boolean
          const: false
        errorCode:
          type: string
        errorMessage:
          type: string
        httpErrorCode:
          type: integer
        errorMetaData:
          type: object
          additionalProperties: true
  responses:
    InvalidRegistration:
      description: Registration names, gid/email relationship, email, phone, or password are invalid.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RegistrationAlreadyExists:
      description: An Identity account/credential already exists or the registration conflicts with an existing identity.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RegistrationFailed:
      description: Registration could not be completed because of an internal dependency or persistence failure.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
