openapi: 3.1.0
info:
  title: GroveHub Identity API
  version: 0.2.0
  description: Identity Auth entry-point contract.
paths:
  /auth/register:
    post:
      operationId: registerIdentityAccount
      summary: Register a GroveHub identity account and password credential
      description: >-
        Auth resolves an existing Foundation Person by exact normalized email, creating a new Person/GID only when needed.
        The request does not accept a gid. firstName, middleName, and lastName are mandatory fields; Auth patches those names on
        the resolved Foundation Person before creating the Identity Account. middleName may be an explicit empty string.
        Note: registration currently uses password credentials and does not yet guarantee transaction-wide rollback across Foundation and Identity.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Identity account and password credential created.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterSuccessResponse"
        "400":
          $ref: "#/components/responses/InvalidRegistration"
        "409":
          $ref: "#/components/responses/RegistrationAlreadyExists"
        "500":
          $ref: "#/components/responses/RegistrationFailed"
components:
  headers:
    TraceID:
      description: GroveHub trace identifier for support and correlation. W3C traceparent remains the propagation contract.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - firstName
        - middleName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: Mandatory current first name; applied to the resolved Foundation Person before Account creation.
        middleName:
          type: string
          maxLength: 100
          description: Mandatory field; may be empty when the person has no middle name. Applied to the resolved Foundation Person before Account creation.
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: Mandatory current last name; applied to the resolved Foundation Person before Account creation.
        email:
          type: string
          format: email
          minLength: 1
          description: Required Identity email and canonical Person-resolution key.
        phoneNumber:
          type: string
          description: Optional phone number. Identity normalizes it before Account creation.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Password is validated but never trimmed, lowercased, or otherwise normalized.
    RegisterResult:
      type: object
      additionalProperties: false
      required:
        - accountId
        - personGid
        - gid
        - email
        - status
      properties:
        accountId:
          type: string
          format: uuid
        personGid:
          type: string
          format: uuid
        gid:
          type: string
          format: uuid
          description: Same Foundation Person identifier as personGid.
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - DEACTIVATED
    RegisterSuccessResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/RegisterResult"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - errorCode
        - errorMessage
        - httpErrorCode
        - errorMetaData
      properties:
        success:
          type: boolean
          const: false
        errorCode:
          type: string
        errorMessage:
          type: string
        httpErrorCode:
          type: integer
        errorMetaData:
          type: object
          additionalProperties: true
  responses:
    InvalidRegistration:
      description: Registration names, email, phone, password or request fields are invalid.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RegistrationAlreadyExists:
      description: An Identity account/credential already exists or the registration conflicts with an existing identity.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RegistrationFailed:
      description: Registration could not be completed because of an internal dependency or persistence failure.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
