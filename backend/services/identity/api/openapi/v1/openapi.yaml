openapi: 3.1.0
info:
  title: GroveHub Identity API
  version: 0.1.1
  description: Minimal Identity service contract for Phase 0.1.1.
paths:
  /identity/health:
    get:
      operationId: getIdentityHealth
      summary: Check Identity service health
      tags:
        - Identity
      responses:
        "200":
          description: Identity service is healthy.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityHealthSuccessResponse"
              examples:
                healthy:
                  value:
                    success: true
                    data:
                      service: identity
                      status: ok
components:
  headers:
    TraceID:
      description: GroveHub trace identifier for support and log/trace correlation. Trace propagation between services uses the W3C traceparent header.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  schemas:
    IdentityHealthSuccessResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/IdentityHealthData"
    IdentityHealthData:
      type: object
      additionalProperties: false
      required:
        - service
        - status
      properties:
        service:
          type: string
          const: identity
        status:
          type: string
          const: ok
