openapi: 3.1.0
info:
  title: GroveHub Foundation API
  version: 0.2.0
  description: Foundation person/GID aggregate and shared-search contract.
paths:
  /foundation/persons:
    post:
      operationId: createFoundationPerson
      summary: Create a permanent GroveHub person identity or return the existing person matched by contact
      tags:
        - Foundation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonRequest"
      responses:
        "200":
          description: A submitted normalized email or phone already belongs to an existing person; that person is returned and no new GID is created.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonSuccessResponse"
        "201":
          description: Person created with a new permanent GID.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonSuccessResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/ContactConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /foundation/persons/search:
    post:
      operationId: searchFoundationPersons
      summary: Search people using the shared GroveHub search contract
      description: >-
        searchText is matched against the Foundation search projection. Filters use service-owned field names,
        never raw database columns. Foundation currently supports gid, firstName, middleName, lastName, status,
        createdAt, updatedAt, contacts.email, contacts.phone, contacts.primaryEmail, contacts.primaryPhone,
        contacts.verifiedEmail, and contacts.verifiedPhone. Cursor values are opaque and must be returned unchanged.
      tags:
        - Foundation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Matching people returned using cursor pagination.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonSearchSuccessResponse"
        "400":
          $ref: "#/components/responses/InvalidSearch"
        "500":
          $ref: "#/components/responses/InternalError"
  /foundation/persons/{gid}:
    parameters:
      - $ref: "#/components/parameters/GID"
    get:
      operationId: getFoundationPersonByGID
      summary: Get the complete Person aggregate by GID
      tags:
        - Foundation
      responses:
        "200":
          description: Person found.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonSuccessResponse"
        "400":
          $ref: "#/components/responses/InvalidGID"
        "404":
          $ref: "#/components/responses/PersonNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateFoundationPerson
      summary: Partially update names or replace the Person contact set
      description: >-
        Omitted fields are unchanged. When contacts is present, its emails and phones arrays are treated as the
        complete desired contact set for the person. isVerified is Foundation-controlled and cannot be set here.
      tags:
        - Foundation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonRequest"
      responses:
        "200":
          description: Person updated or returned unchanged when the submitted aggregate is identical.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonSuccessResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/PersonNotFound"
        "409":
          $ref: "#/components/responses/ContactConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /foundation/persons/{gid}/deactivate:
    parameters:
      - $ref: "#/components/parameters/GID"
    patch:
      operationId: deactivateFoundationPerson
      summary: Deactivate a person while preserving the permanent GID and contact history
      tags:
        - Foundation
      responses:
        "200":
          description: Person deactivated or already deactivated. The complete aggregate is returned.
          headers:
            X-Trace-ID:
              $ref: "#/components/headers/TraceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonSuccessResponse"
        "400":
          $ref: "#/components/responses/InvalidGID"
        "404":
          $ref: "#/components/responses/PersonNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  headers:
    TraceID:
      description: GroveHub trace identifier for support and correlation. W3C traceparent remains the propagation contract.
      schema:
        type: string
        pattern: "^[0-9a-f]{32}$"
  parameters:
    GID:
      name: gid
      in: path
      required: true
      description: Permanent GroveHub UUIDv7 person identifier.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  schemas:
    ContactInput:
      type: object
      additionalProperties: false
      required:
        - value
      properties:
        value:
          type: string
          minLength: 1
        isPrimary:
          type: boolean
          default: false
    ContactsInput:
      type: object
      additionalProperties: false
      properties:
        emails:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ContactInput"
        phones:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/ContactInput"
    Contact:
      type: object
      additionalProperties: false
      required:
        - value
        - isPrimary
        - isVerified
      properties:
        value:
          type: string
        isPrimary:
          type: boolean
        isVerified:
          type: boolean
    Contacts:
      type: object
      additionalProperties: false
      required:
        - emails
        - phones
      properties:
        emails:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        phones:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
    CreatePersonRequest:
      type: object
      additionalProperties: false
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        contacts:
          $ref: "#/components/schemas/ContactsInput"
    UpdatePersonRequest:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        contacts:
          $ref: "#/components/schemas/ContactsInput"
    Person:
      type: object
      additionalProperties: false
      required:
        - gid
        - firstName
        - lastName
        - contacts
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        gid:
          type: string
          format: uuid
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        contacts:
          $ref: "#/components/schemas/Contacts"
        status:
          type: string
          enum:
            - ACTIVE
            - DEACTIVATED
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SearchOperator:
      type: string
      enum:
        - EQUALS
        - NOT_EQUALS
        - IN
        - NIN
        - EXISTS
        - NOT_EXISTS
        - GT
        - GTE
        - LT
        - LTE
        - CONTAINS
        - STARTS_WITH
    SearchFilter:
      type: object
      additionalProperties: false
      required:
        - field
        - operator
      properties:
        field:
          type: string
        operator:
          $ref: "#/components/schemas/SearchOperator"
        values:
          type: array
          maxItems: 50
          items:
            type: string
    SearchDirection:
      type: string
      enum:
        - ASC
        - DESC
    SearchSort:
      type: object
      additionalProperties: false
      required:
        - field
      properties:
        field:
          type: string
        direction:
          $ref: "#/components/schemas/SearchDirection"
    SearchPageRequest:
      type: object
      additionalProperties: false
      properties:
        rows:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        cursor:
          type: string
          description: Opaque cursor returned by the previous search response.
    SearchRequest:
      type: object
      additionalProperties: false
      required:
        - pageInfo
      properties:
        searchText:
          type: string
          maxLength: 256
        filters:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/SearchFilter"
        sort:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/SearchSort"
        pageInfo:
          $ref: "#/components/schemas/SearchPageRequest"
    SearchPageResponse:
      type: object
      additionalProperties: false
      required:
        - rows
        - hasNext
      properties:
        rows:
          type: integer
        nextCursor:
          type: string
        hasNext:
          type: boolean
    PersonSearchResult:
      type: object
      additionalProperties: false
      required:
        - items
        - pageInfo
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        pageInfo:
          $ref: "#/components/schemas/SearchPageResponse"
    PersonSuccessResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/Person"
    PersonSearchSuccessResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/PersonSearchResult"
    PersonErrorMetadata:
      type: object
      additionalProperties: false
      properties:
        gid:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - errorCode
        - errorMessage
        - httpErrorCode
        - errorMetaData
      properties:
        success:
          type: boolean
          const: false
        errorCode:
          type: string
        errorMessage:
          type: string
        httpErrorCode:
          type: integer
        errorMetaData:
          $ref: "#/components/schemas/PersonErrorMetadata"
  responses:
    InvalidGID:
      description: The supplied GID is not a valid UUIDv7 person identifier.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: Person names, contacts, or request structure are invalid.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidSearch:
      description: Search field, operator, value, row limit, sort, or cursor is invalid.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ContactConflict:
      description: Submitted contacts resolve to different people or a contact belongs to another GID.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PersonNotFound:
      description: No Foundation person exists for the supplied GID.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Foundation could not complete the operation.
      headers:
        X-Trace-ID:
          $ref: "#/components/headers/TraceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
