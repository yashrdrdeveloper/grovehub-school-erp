openapi: 3.1.0
info:
  title: GrooveHub Integration API
  version: 0.2.0
  description: Gmail OAuth and mailbox tests; account APIs need trusted verified-principal middleware.
paths:
  /integrations/providers:
    get:
      summary: List registered provider descriptors
      responses:
        "200": { description: Provider catalog }
  /integrations/connections:
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Create a provider connection in PENDING_SETUP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, ownerGid]
              properties:
                provider: { type: string, enum: [GMAIL, OUTLOOK] }
                ownerGid: { type: string, format: uuid }
      responses:
        "201": { description: Pending connection created }
        "403": { description: Verified principal not provided }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: List connections owned by current actor
      responses:
        "200": { description: Connections with lastTestedAt and lastTestStatus }
  /integrations/connections/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: Get owned connection
      responses:
        "200": { description: Connection }
    delete:
      security: [{ verifiedPrincipal: [] }]
      summary: Disconnect account and erase saved OAuth credential
      responses:
        "200": { description: Disconnected connection }
  /integrations/connections/{id}/oauth/start:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Start Gmail OAuth for pending connection
      responses:
        "200": { description: Authorization URL }
        "501": { description: Gmail OAuth not configured }
  /integrations/oauth/gmail/callback:
    get:
      summary: Google OAuth callback authenticated by single-use short-lived state
      parameters:
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: code, required: true, schema: { type: string } }
      responses:
        "200": { description: Active connection established }
        "400": { description: OAuth denied or state invalid }
  /integrations/connections/{id}/test:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Run Gmail read-permission or self-addressed send test, persisting result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [direction]
              properties:
                direction: { type: string, enum: [INBOUND, OUTBOUND] }
      responses:
        "200": { description: Saved test result including SUCCESS or FAILED }
  /integrations/connections/{id}/tests:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: List latest 100 saved tests for owned connection
      responses:
        "200": { description: Test history }
components:
  securitySchemes:
    verifiedPrincipal:
      type: http
      scheme: bearer
      description: Trusted middleware must populate verified principal context; not connected in current launcher.
