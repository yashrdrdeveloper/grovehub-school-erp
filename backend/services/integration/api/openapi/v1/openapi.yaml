openapi: 3.1.0
info:
  title: GrooveHub Integration API
  version: 0.5.0
  description: Generic capability-based Integration service with Gmail and Outlook OAuth, provider actions, connection tests and Gmail webhook watch. Communication owns message storage and synchronization.
paths:
  /integrations/providers:
    get:
      summary: List registered provider descriptors
      responses:
        "200": { description: Provider catalog }
  /integrations/providers/{provider}:
    parameters:
      - { in: path, name: provider, required: true, schema: { type: string } }
    get:
      summary: Discover provider capabilities and currently configured executable actions
      responses:
        "200": { description: Provider descriptor with availableActions and oauthConfigured }
        "400": { description: Unknown provider }
  /integrations/connections:
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Create PENDING_SETUP provider connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, ownerGid]
              properties:
                provider: { type: string, enum: [GMAIL, OUTLOOK] }
                ownerGid: { type: string, format: uuid }
      responses:
        "201": { description: Pending connection }
        "403": { description: Authorization unavailable }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: List current actor's connections
      responses:
        "200": { description: Connections with latest connectivity test }
  /integrations/connections/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: Get connection
      responses:
        "200": { description: Connection }
    delete:
      security: [{ verifiedPrincipal: [] }]
      summary: Disconnect and erase stored OAuth token
      responses:
        "200": { description: Disconnected connection }
  /integrations/connections/{id}/oauth/start:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Start Gmail or Outlook OAuth connection authorization
      responses:
        "200": { description: Authorization URL }
  /integrations/connections/oauth/{provider}/callback:
    get:
      summary: Exchange Gmail or Outlook authorization code with a one-time OAuth state
      parameters:
        - { in: path, name: provider, required: true, schema: { type: string, enum: [gmail, outlook] } }
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: code, required: true, schema: { type: string } }
      responses:
        "200": { description: Connection activated }
  /integrations/connections/{id}/test:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Persist Gmail or Outlook inbound-access or self-addressed outbound test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [direction]
              properties:
                direction: { type: string, enum: [INBOUND, OUTBOUND] }
      responses:
        "200": { description: Saved test result (not a delivery receipt) }
  /integrations/connections/{id}/tests:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: Connection test history
      responses:
        "200": { description: Latest 100 results }
  /integrations/connections/{id}/watch:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Register or renew Gmail provider subscription
      responses:
        "200": { description: Watch expiry }
  /integrations/connections/{id}/actions/{action}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: action, required: true, schema: { type: string, example: mail.send } }
    post:
      summary: Execute a registered provider capability using the connection's encrypted credentials
      description: >
        Available actions depend on provider configuration. Gmail supports mail.profile,
        mail.list, mail.get, mail.history, mail.attachment.get, mail.send.
        Outlook supports mail.profile, mail.list, mail.get, mail.delta,
        mail.attachment.get and mail.send. OAuth state and provider credentials
        never appear in this request. The mail.send action takes structured to/cc/bcc/subject/body/attachments,\n        and the adapters build MIME and provider-specific encoding. mail.get and mail.list return\n        normalized messages. Attachment downloads return standard base64 content.\n        Mailbox data and cursors are not stored by Integration.
      security: [{ verifiedPrincipal: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              additionalProperties: false
              properties:
                input:
                  type: object
                  additionalProperties: true
            examples:
              gmailList: { value: { input: { pageToken: "" } } }
              gmailHistory: { value: { input: { startHistoryId: "123456" } } }
              outlookDelta: { value: { input: { cursor: "" } } }
              mailGet: { value: { input: { messageId: "provider-message-id" } } }
              attachmentGet: { value: { input: { messageId: "id", attachmentId: "attachment-id" } } }
              send:
                summary: Send a plain-text email using the connected mailbox
                value:
                  input:
                    to: ["yashrdrdeveloper@gmail.com"]
                    cc: []
                    bcc: []
                    subject: "GrooveHub Integration Test"
                    body:
                      text: "Hello from GrooveHub! This is a Gmail integration test."
              sendHTML:
                summary: Send HTML and text with a small attachment
                value:
                  input:
                    to: ["yashrdrdeveloper@gmail.com"]
                    cc: ["copy@example.com"]
                    bcc: []
                    replyTo: []
                    subject: "GrooveHub HTML Test"
                    body:
                      text: "Hello from GrooveHub!"
                      html: "<p>Hello from <strong>GrooveHub</strong>!</p>"
                    attachments:
                      - filename: "hello.txt"
                        contentType: "text/plain"
                        contentBase64: "SGVsbG8gZnJvbSBHcm9vdmVIdWIhCg=="
      responses:
        "200": { description: Provider action output; Graph sendMail only returns accepted status }
        "400": { description: Invalid action input; malformed recipients, message or attachment }
        "403": { description: Access denied or connection not owned }
        "409": { description: Connection not active }
        "429": { description: Provider rate limited }
        "501": { description: Unsupported action }
        "503": { description: Provider not configured }
  /integrations/webhooks/gmail:
    post:
      security: [{ googlePushJWT: [] }]
      summary: Verify Gmail Pub/Sub notification and publish mailbox-change event
      description: Publishes integration.mailbox.changed.v1 to NATS for each matched active provider connection. No message sync or persistence. Returns retryable failure on publish error.
      responses:
        "204": { description: Notification published to configured messaging transport }
        "401": { description: Google push JWT authentication failed }
        "503": { description: Event publishing failed, Pub/Sub should retry }
components:
  securitySchemes:
    googlePushJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed Pub/Sub push OIDC JWT
    verifiedPrincipal:
      type: http
      scheme: bearer
      description: Trusted IAM middleware must supply owner/tenant context; not yet connected to the launcher.
