openapi: 3.1.0
info:
  title: GrooveHub Integration API
  version: 0.2.0
  description: Gmail OAuth and mailbox tests; account APIs need trusted verified-principal middleware.
paths:
  /integrations/providers:
    get:
      summary: List registered provider descriptors
      responses:
        "200": { description: Provider catalog }
  /integrations/connections:
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Create a provider connection in PENDING_SETUP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, ownerGid]
              properties:
                provider: { type: string, enum: [GMAIL, OUTLOOK] }
                ownerGid: { type: string, format: uuid }
      responses:
        "201": { description: Pending connection created }
        "403": { description: Verified principal not provided }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: List connections owned by current actor
      responses:
        "200": { description: Connections with lastTestedAt and lastTestStatus }
  /integrations/connections/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: Get owned connection
      responses:
        "200": { description: Connection }
    delete:
      security: [{ verifiedPrincipal: [] }]
      summary: Disconnect account and erase saved OAuth credential
      responses:
        "200": { description: Disconnected connection }
  /integrations/connections/{id}/oauth/start:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Start Gmail OAuth for pending connection
      responses:
        "200": { description: Authorization URL }
        "501": { description: Gmail OAuth not configured }
  /integrations/oauth/gmail/callback:
    get:
      summary: Google OAuth callback authenticated by single-use short-lived state
      parameters:
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: code, required: true, schema: { type: string } }
      responses:
        "200": { description: Active connection established }
        "400": { description: OAuth denied or state invalid }
  /integrations/connections/{id}/test:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Run Gmail read-permission or self-addressed send test, persisting result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [direction]
              properties:
                direction: { type: string, enum: [INBOUND, OUTBOUND] }
      responses:
        "200": { description: Saved test result including SUCCESS or FAILED }
  /integrations/connections/{id}/sync:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Run paginated Gmail initial or history-based incremental sync
      description: Stores provider message references only. Requires ACTIVE Gmail connection. Does not populate Communication or ingest email bodies. Protected until IAM middleware is connected.
      responses:
        "200": { description: Sync summary including mode, processed, deleted and cursor }
        "403": { description: Verified principal absent or connection not owned }
        "413": { description: Sync exceeds 100 pages, cursor not advanced }
  /integrations/connections/{id}/watch:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Register or renew Gmail mailbox push watch
      description: Requires active Gmail mailbox, configured Pub/Sub topic, verified tenant principal. Watch expires and is periodically renewed.
      responses:
        "200": { description: Watch expiration and connection ID }
        "403": { description: Verified principal missing or owner mismatch }
        "501": { description: Gmail OAuth not configured }
  /integrations/webhooks/gmail:
    post:
      summary: Receive Google Cloud Pub/Sub push notifications
      description: Google-signed JWT is verified against Google JWKS; issuer, audience, service-account email, and expiry validated. Synchronization completes before a 204 acknowledgement. Failed sync returns non-2xx for Pub/Sub retry.
      security: [{ googlePushJWT: [] }]
      responses:
        "204": { description: Gmail history synchronized }
        "400": { description: Invalid notification }
        "401": { description: Invalid or missing Google-signed JWT }
        "503": { description: Temporary processing failure; Pub/Sub should retry }
  /integrations/connections/{id}/tests:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: List latest 100 saved tests for owned connection
      responses:
        "200": { description: Test history }
components:
  securitySchemes:
    googlePushJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed Google Pub/Sub push OIDC JWT; audience and service-account email must match configuration.
    verifiedPrincipal:
      type: http
      scheme: bearer
      description: Trusted middleware must populate verified principal context; not connected in current launcher.
