openapi: 3.1.0
info:
  title: GrooveHub Integration API
  version: 0.3.0
  description: Provider connection, OAuth, mailbox watch, test history and stateless Gmail API capabilities. Message storage and synchronization belong to Communication.
paths:
  /integrations/providers:
    get:
      summary: List registered provider descriptors
      responses:
        "200": { description: Provider catalog }
  /integrations/connections:
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Create PENDING_SETUP provider connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, ownerGid]
              properties:
                provider: { type: string, enum: [GMAIL, OUTLOOK] }
                ownerGid: { type: string, format: uuid }
      responses:
        "201": { description: Pending connection }
        "403": { description: Authorization unavailable }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: List current actor's connections
      responses:
        "200": { description: Connections with latest connectivity test }
  /integrations/connections/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: Get connection
      responses:
        "200": { description: Connection }
    delete:
      security: [{ verifiedPrincipal: [] }]
      summary: Disconnect and erase stored OAuth token
      responses:
        "200": { description: Disconnected connection }
  /integrations/connections/{id}/oauth/start:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Start Gmail OAuth connection authorization
      responses:
        "200": { description: Authorization URL }
  /integrations/oauth/gmail/callback:
    get:
      summary: Exchange Google callback code with one-time OAuth state
      parameters:
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: code, required: true, schema: { type: string } }
      responses:
        "200": { description: Connection activated }
  /integrations/connections/{id}/test:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Persist Gmail inbound-access or self-addressed outbound test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [direction]
              properties:
                direction: { type: string, enum: [INBOUND, OUTBOUND] }
      responses:
        "200": { description: Saved test result (not a delivery receipt) }
  /integrations/connections/{id}/tests:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: Connection test history
      responses:
        "200": { description: Latest 100 results }
  /integrations/connections/{id}/watch:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Register or renew Gmail provider subscription
      responses:
        "200": { description: Watch expiry }
  /integrations/connections/{id}/mail/profile:
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: Fetch live Gmail profile and current history cursor (not persisted)
      responses:
        "200": { description: Live Gmail profile }
  /integrations/connections/{id}/mail/messages:
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: List one page of Gmail message IDs
      parameters:
        - { in: query, name: pageToken, schema: { type: string } }
      responses:
        "200": { description: Provider message page }
  /integrations/connections/{id}/mail/messages/{messageId}:
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: Read Gmail message metadata; no message stored
      parameters:
        - { in: path, name: messageId, required: true, schema: { type: string } }
      responses:
        "200": { description: Provider message metadata }
  /integrations/connections/{id}/mail/history:
    get:
      security: [{ verifiedPrincipal: [] }]
      summary: Read provider history page from caller-owned cursor; no cursor stored
      parameters:
        - { in: query, name: startHistoryId, required: true, schema: { type: string } }
        - { in: query, name: pageToken, schema: { type: string } }
      responses:
        "200": { description: Gmail history page with cursor }
        "500": { description: Provider history error, including expired provider cursor }
  /integrations/connections/{id}/mail/send:
    post:
      security: [{ verifiedPrincipal: [] }]
      summary: Send caller-composed raw RFC 5322 Gmail message; Integration stores no message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [raw]
              properties:
                raw:
                  type: string
                  description: Base64url-encoded RFC 5322 email
      responses:
        "200": { description: Gmail provider IDs, not a delivery receipt }
  /integrations/webhooks/gmail:
    post:
      security: [{ googlePushJWT: [] }]
      summary: Verify Gmail Pub/Sub notification and publish mailbox-change event
      description: Publishes integration.mailbox.changed.v1 to NATS for each matched active provider connection. No message sync or persistence. Returns retryable failure on publish error.
      responses:
        "204": { description: Notification published to configured messaging transport }
        "401": { description: Google push JWT authentication failed }
        "503": { description: Event publishing failed, Pub/Sub should retry }
components:
  securitySchemes:
    googlePushJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed Pub/Sub push OIDC JWT
    verifiedPrincipal:
      type: http
      scheme: bearer
      description: Trusted IAM middleware must supply owner/tenant context; not yet connected to the launcher.
