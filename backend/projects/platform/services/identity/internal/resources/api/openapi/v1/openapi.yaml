components:
  securitySchemes:
    workloadBearer:
      type: http
      scheme: bearer
      description: Signed Platform workload credential with operation scope.
    identityProof:
      type: apiKey
      in: header
      name: X-GH-Identity-Proof
      description: Route-specific opaque access, refresh, recovery, invitation or grant proof supplied by the trusted School adapter.
  schemas:
    LoginBody:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: {type: string, description: Canonical email address}
        password: {type: string, format: password}
    ForgotBody:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email}
    ResetBody:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        newPassword: {type: string, format: password}
    ChangePasswordBody:
      $ref: '#/components/schemas/ResetBody'
    ReauthenticationBody:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, format: password}
    SetupBody:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}
    PersonNames:
      type: object
      additionalProperties: false
      required: [firstName, lastName]
      properties:
        firstName: {type: string}
        middleName: {type: [string, 'null']}
        lastName: {type: string}
    CreateAccountBody:
      type: object
      additionalProperties: false
      required: [person, email]
      properties:
        person:
          $ref: '#/components/schemas/PersonNames'
        email: {type: string, format: email}
        phoneNumber: {type: string}
    UpdateAccountBody:
      type: object
      additionalProperties: false
      properties:
        username: {type: string}
    SearchBody:
      type: object
      description: "The shared coresearch.Request; unknown filter fields/operators are rejected."
      additionalProperties: false
      properties:
        searchText: {type: string}
        filters:
          type: array
          items:
            type: object
            required: [field, operator]
            properties:
              field: {type: string}
              operator: {type: string}
              values:
                type: array
                items: {type: string}
        sort:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              direction: {type: string, enum: [ASC, DESC]}
        pageInfo:
          type: object
          properties:
            rows: {type: integer, minimum: 1, maximum: 100}
            cursor: {type: string}
    Account:
      type: object
      properties:
        accountId: {type: string, format: uuid}
        personGid: {type: string, format: uuid}
        username: {type: [string, 'null']}
        email: {type: string, format: email}
        status: {type: string, enum: [PENDING_SETUP, ACTIVE, SUSPENDED, DEACTIVATED]}
        version: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreatedAccount:
      type: object
      properties:
        accountId: {type: string, format: uuid}
        personGid: {type: string, format: uuid}
        email: {type: string, format: email}
        status: {type: string}
        invitation:
          type: object
          properties:
            status: {type: string, enum: [QUEUED]}
    LoginData:
      type: object
      properties:
        accountId: {type: string, format: uuid}
        personGid: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        expiresIn: {type: integer, example: 900}
        requiresSetup: {type: boolean}
    RefreshData:
      type: object
      properties:
        sessionId: {type: string, format: uuid}
        expiresIn: {type: integer}
        refreshed: {type: boolean}
    AcceptedData:
      type: object
      properties:
        accepted: {type: boolean}
        delivery: {type: string, enum: [EMAIL]}
    StatusData:
      type: object
      properties:
        status: {type: string}
        sessionsRevoked: {type: boolean}
    RevocationData:
      type: object
      properties:
        status: {type: string}
        revokedCount: {type: integer}
    GrantData:
      type: object
      properties:
        verified: {type: boolean}
        purpose: {type: string, enum: [PASSWORD_RESET, ACCOUNT_SETUP]}
        expiresIn: {type: integer}
    SetupData:
      type: object
      properties:
        accountId: {type: string, format: uuid}
        personGid: {type: string, format: uuid}
        username: {type: string}
        status: {type: string}
        setupCompleted: {type: boolean}
    InvitationData:
      type: object
      properties:
        accountId: {type: string, format: uuid}
        invitationStatus: {type: string}
    SessionsData:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              sessionId: {type: string, format: uuid}
              current: {type: boolean}
              createdAt: {type: string, format: date-time}
              lastActiveAt: {type: [string, 'null'], format: date-time}
              expiresAt: {type: string, format: date-time}
    SearchData:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Account'}
        pageInfo:
          type: object
          properties:
            rows: {type: integer}
            hasNext: {type: boolean}
            nextCursor: {type: string}
    ErrorResponse:
      type: object
      required: [success, errorCode, errorMessage, httpErrorCode, errorMetaData]
      properties:
        success: {type: boolean, const: false}
        errorCode: {type: string}
        errorMessage: {type: string}
        httpErrorCode: {type: integer}
        errorMetaData: {type: object}
    LoginDataSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/LoginData'
    RefreshDataSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/RefreshData'
    AcceptedDataSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/AcceptedData'
    GrantDataSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/GrantData'
    StatusDataSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/StatusData'
    SetupDataSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/SetupData'
    RevocationDataSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/RevocationData'
    SessionsDataSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/SessionsData'
    AccountSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/Account'
    CreatedAccountSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/CreatedAccount'
    SearchDataSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/SearchData'
    InvitationDataSuccess:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          $ref: '#/components/schemas/InvitationData'
