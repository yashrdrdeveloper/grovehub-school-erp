openapi: 3.1.0
info:
  title: GrooveHub Identity API
  version: 1.0.0
  description: |
    Resource-first Identity API. Server-side opaque access and refresh cookies
    are never exposed as JSON secrets. Success/error envelopes are provided by
    the platform libs/core/http response writer; no separate Identity envelope.
servers:
  - url: /
security:
  - workloadBearer: []
paths:
  /identity/restricted/auth/login:
    post:
      operationId: login
      summary: "Login with email and password"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      security:
        - workloadBearer: []
      responses:
        '200':
          description: "Login with email and password"
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
            Set-Cookie:
              description: Opaque HttpOnly session or purpose-bound grant cookie
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginDataSuccess'
        '400':
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthenticated or invalid grant"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Authorization or scope denied"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: "Conflict"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: "Rate limited"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /identity/restricted/auth/refresh:
    post:
      operationId: refresh
      summary: "Rotate the HttpOnly refresh cookie"
      security:
