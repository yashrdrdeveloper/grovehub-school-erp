openapi: 3.1.0
info:
  title: GrooveHub Audit API
  version: 1.0.0
  description: Tenant-scoped audit search. The verified actor and existing Identity policies determine visibility.
security:
  - workloadBearer: []
    identityProof: []
paths:
  /audit/restricted/school-status-receipts:
    post:
      operationId: recordSchoolStatusReceipt
      summary: Persist a committed school activation or disabling receipt
      security: [{workloadBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolStatusReceipt'
      responses:
        '204': {description: Persisted or identical replay}
        '400': {description: Invalid receipt}
        '403': {description: Denied}
        '409': {description: Conflicting receipt}
        '503': {description: Audit unavailable}
  /audit/restricted/school-mutation-receipts/search:
    post:
      operationId: searchSchoolMutationReceipts
      description: Global receipt metadata with optional school and operation filters for the dedicated Internal Tool receipt reader only.
      security: [{workloadBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolReceiptSearchInput'
      responses:
        '200':
          description: Receipt metadata page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolReceiptPage'
        '400': {description: Invalid pagination or filter}
        '403': {description: Denied}
        '503': {description: Audit unavailable}
  /audit/restricted/school-rename-receipts:
    post:
      operationId: recordSchoolRenameReceipt
      description: Persist a committed School rename receipt from its dedicated school-bound publisher.
      security: [{workloadBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRenameReceipt'
      responses:
        '204': {description: Persisted or identical duplicate}
        '400': {description: Invalid receipt}
        '403': {description: School or credential denied}
        '409': {description: Conflicting receipt}
        '503': {description: Audit unavailable}
  /audit/restricted/schools/{schoolId}/activity-check:
    get:
      operationId: checkSchoolAuditActivity
      summary: Check if a single authorized school has recorded audit activity
      description: Requires a school-bound Internal Tool workload. 404 means no recorded activity, not necessarily a nonexistent school.
      security: [{workloadBearer: []}]
      parameters:
        - {in: path, name: schoolId, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Activity exists}
        '403': {description: Access denied}
        '404': {description: No recorded activity}
        '503': {description: Audit unavailable}
  /audit/restricted/operator-activities/search:
    post:
      operationId: searchOperatorActivities
      summary: Search centralized global operator occurrences
      security: [{workloadBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorSearchInput'
      responses:
        '200':
          description: Operator activity page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorActivityPage'
        '400': {description: Invalid pagination}
        '403': {description: Access denied}
        '503': {description: Audit unavailable}
  /audit/restricted/operator-activities:
    post:
      operationId: recordOperatorActivity
      summary: Persist an immutable Internal Tool operator activity
      description: Dedicated internal.audit.operator.write workload only. No tenant or browser actor is accepted. Identical occurrence retries return 204.
      security: [{workloadBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorActivity'
      responses:
        '204': {description: Persisted or identical duplicate}
        '400': {description: Invalid activity}
        '403': {description: Access denied}
        '409': {description: Conflicting occurrence}
        '503': {description: Audit unavailable}
  /audit/restricted/search:
    post:
      operationId: searchAuditActivities
      summary: Search audit activities visible to the authenticated actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Audit activity page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    workloadBearer:
      type: http
      scheme: bearer
    identityProof:
      type: apiKey
      in: header
      name: X-GH-Identity-Proof
  schemas:
    SchoolStatusReceipt:
      type: object
      additionalProperties: false
      required: [executionId, schoolId, previousVersion, occurredAt, operation]
      properties:
        executionId: {type: string, format: uuid}
        schoolId: {type: string, format: uuid}
        previousVersion: {type: integer, format: int64, minimum: 1}
        correlationId: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        operation: {type: string}
    SchoolReceiptView:
      type: object
      required: [executionId, schoolId, previousVersion, occurredAt, operation]
      properties:
        operation: {type: string}
        executionId: {type: string, format: uuid}
        schoolId: {type: string, format: uuid}
        previousVersion: {type: string, pattern: '^[1-9][0-9]*$'}
        correlationId: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
    SchoolReceiptPage:
      type: object
      required: [records, pageNumber, rowSize, hasMore]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SchoolReceiptView'
        pageNumber: {type: integer, format: int32}
        rowSize: {type: integer, format: int32}
        hasMore: {type: boolean}
    SchoolRenameReceipt:
      type: object
      additionalProperties: false
      required: [executionId, schoolId, previousVersion, occurredAt]
      properties:
        executionId: {type: string, format: uuid}
        schoolId: {type: string, format: uuid}
        previousVersion: {type: integer, format: int64, minimum: 1}
        correlationId: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
    SchoolReceiptSearchInput:
      type: object
      additionalProperties: false
      required: [pageNumber, rowSize]
      properties:
        pageNumber: {type: integer, format: int32, minimum: 1, maximum: 10000}
        rowSize: {type: integer, format: int32, minimum: 1, maximum: 100}
        schoolId: {type: string, format: uuid}
        operation: {type: string, description: RENAME or ACTIVATE or DISABLE}
    OperatorSearchInput:
      type: object
      additionalProperties: false
      required: [pageNumber, rowSize]
      properties:
        pageNumber: {type: integer, format: int32, minimum: 1, maximum: 10000}
        rowSize: {type: integer, format: int32, minimum: 1, maximum: 100}
    OperatorActivityPage:
      type: object
      required: [records, pageNumber, rowSize, hasMore]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/OperatorActivity'
        pageNumber: {type: integer, format: int32}
        rowSize: {type: integer, format: int32}
        hasMore: {type: boolean}
    OperatorActivity:
      type: object
      additionalProperties: false
      required: [eventId, actorId, resourceId, operation, occurredAt]
      properties:
        correlationId: {type: string, format: uuid}
        eventId: {type: string, format: uuid}
        actorId: {type: string, format: uuid}
        resourceId: {type: string, format: uuid}
        operation: {type: string}
        occurredAt: {type: string, format: date-time}
    Filter:
      type: object
      required: [field, operator]
      properties:
        field: {type: string}
        operator:
          type: string
          enum: [EQUALS, NOT_EQUALS, IN, NIN, EXISTS, NOT_EXISTS, GT, GTE, LT, LTE, CONTAINS, STARTS_WITH]
        values:
          type: array
          items: {type: string}
    Sort:
      type: object
      required: [field, direction]
      properties:
        field: {type: string}
        direction: {type: string, enum: [ASC, DESC]}
    SearchRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          description: ME limits results to the current actor; other scopes require tenant audit authorization and validation.
        searchText: {type: string}
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        sort:
          type: array
          items:
            $ref: '#/components/schemas/Sort'
        pageInfo:
          type: object
          properties:
            rows: {type: integer, maximum: 100}
            rowSize: {type: integer, maximum: 100}
            pageNumber: {type: integer}
            cursor: {type: string}
    Activity:
      type: object
      required: [auditId, sourceEventId, assetType, assetId, auditType, operation, source, assetVersion, data, occurredAt, ingestedAt]
      properties:
        auditId: {type: string, format: uuid}
        sourceEventId: {type: string, format: uuid}
        assetType: {type: string}
        assetId: {type: string, format: uuid}
        auditType: {type: string}
        operation: {type: string}
        source: {type: string}
        occurrenceId: {type: string, format: uuid}
        assetVersion: {type: integer, format: int64}
        actorId: {type: string, format: uuid}
        subjectAccountId: {type: string, format: uuid}
        personId: {type: string, format: uuid}
        data: {}
        occurredAt: {type: string, format: date-time}
        ingestedAt: {type: string, format: date-time}
    PageInfo:
      type: object
      required: [rows, hasPrevious, hasNext]
      properties:
        rows: {type: integer}
        totalRecords: {type: integer, format: int64}
        pageNumber: {type: integer}
        rowSize: {type: integer}
        totalPages: {type: integer, format: int64}
        hasPrevious: {type: boolean}
        hasNext: {type: boolean}
        nextCursor: {type: string}
    SearchResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, const: true}
        data:
          type: object
          required: [items, pageInfo]
          properties:
            items:
              type: [array, 'null']
              items:
                $ref: '#/components/schemas/Activity'
            pageInfo:
              $ref: '#/components/schemas/PageInfo'
    Error:
      type: object
      required: [success, errorCode, errorMessage, httpErrorCode, errorMetaData]
      properties:
        success: {type: boolean, const: false}
        errorCode: {type: string}
        errorMessage: {type: string}
        httpErrorCode: {type: integer}
        errorMetaData: {}
