root = "."
tmp_dir = ".runtime/air"

[build]
cmd = "bash scripts/backend/air-build.sh"
bin = ".runtime/bin/groovehub-dev"
delay = 500
include_dir = ["backend", "libs/core"]
exclude_dir = ["vendor", ".generated", ".runtime", "node_modules"]
include_ext = ["go", "mod", "sum", "sql", "yaml", "yml", "json", "tmpl"]
kill_delay = "500ms"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
