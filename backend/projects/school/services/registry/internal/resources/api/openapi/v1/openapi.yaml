openapi: 3.0.3
info:
  title: School Registry
  version: 1.0.0
paths:
  /school/restricted/registry/schools/{schoolId}/name:
    patch:
      operationId: renameSchool
      description: Rename one active school with an execution UUID and expected previous name and version. Identical committed replays return 204.
      security: [{workloadBearer: []}]
      parameters:
        - {in: path, name: schoolId, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolRenameInput'
      responses:
        '204': {description: Committed or identical replay}
        '400': {description: Invalid input}
        '403': {description: Denied or inactive school}
        '404': {description: Missing school}
        '409': {description: Precondition or idempotency conflict}
        '503': {description: Registry unavailable}
  /school/restricted/registry/lookup:
    post:
      operationId: lookupSchools
      description: Only explicitly permitted school UUIDs can be looked up. Missing rows are omitted.
      security: [{workloadBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolLookupInput'
      responses:
        '200':
          description: Authorized school records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolLookupResult'
        '400': {description: Invalid request}
        '403': {description: Workload or school denied}
        '503': {description: Registry unavailable}
components:
  securitySchemes:
    workloadBearer:
      type: http
      scheme: bearer
  schemas:
    SchoolRenameInput:
      type: object
      additionalProperties: false
      required: [expectedName, name, expectedVersion]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        expectedName: {type: string, minLength: 1, maxLength: 150}
        name: {type: string, minLength: 1, maxLength: 150}
    SchoolLookupInput:
      type: object
      required: [schoolIds]
      properties:
        schoolIds:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, format: uuid}
    SchoolRecord:
      type: object
      required: [id, code, name, status, version]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        status: {type: string}
        version: {type: integer, format: int64, minimum: 1}
    SchoolLookupResult:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SchoolRecord'
