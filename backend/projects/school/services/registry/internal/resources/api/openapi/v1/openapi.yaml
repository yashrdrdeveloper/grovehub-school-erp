openapi: 3.0.3
info:
  title: School Registry
  version: 1.0.0
paths:
  /school/restricted/registry/lookup:
    post:
      operationId: lookupSchools
      description: Only explicitly permitted school UUIDs can be looked up. Missing rows are omitted.
      security: [{workloadBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolLookupInput'
      responses:
        '200':
          description: Authorized school records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolLookupResult'
        '400': {description: Invalid request}
        '403': {description: Workload or school denied}
        '503': {description: Registry unavailable}
components:
  securitySchemes:
    workloadBearer:
      type: http
      scheme: bearer
  schemas:
    SchoolLookupInput:
      type: object
      required: [schoolIds]
      properties:
        schoolIds:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, format: uuid}
    SchoolRecord:
      type: object
      required: [id, code, name, status]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        status: {type: string}
    SchoolLookupResult:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SchoolRecord'
